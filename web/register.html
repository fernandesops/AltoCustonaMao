<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Completar Cadastro — Medicamentos de Alto Custo</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<main class="auth-page">
  <div class="auth-box-lg fade-in-up">

    <header class="card" style="padding:1rem 1.5rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between">
      <h1 class="text-blue-900" style="font-size:1.25rem">Completar Cadastro</h1>
      <p class="text-sm text-gray-500">Preencha seus dados para continuar</p>
    </header>

    <div class="card p-8">
        <form id="form-register">

        <!-- DADOS BÁSICOS -->
        <h2 class="text-blue-900 mb-4" style="font-size:1.1rem">Dados Básicos</h2>
        <div class="flex flex-col gap-4">

          <div class="form-group">
            <label class="form-label" for="r-name">
              Nome Completo <span class="form-required" aria-hidden="true">*</span>
            </label>
            <input class="input" id="r-name" name="name" type="text"
              placeholder="Digite seu nome completo" required/>
          </div>

          <div class="form-group">
            <label class="form-label" for="r-email">
              E-mail <span class="form-required" aria-hidden="true">*</span>
            </label>
            <input class="input" id="r-email" name="email" type="email"
              placeholder="seu.nome@email.com" required/>
          </div>

          <div class="form-group">
            <label class="form-label" for="r-cpf">
              CPF <span class="form-required" aria-hidden="true">*</span>
            </label>
            <input class="input" id="r-cpf" name="cpf" type="text"
              placeholder="000.000.000-00" maxlength="14" autocomplete="off" required/>
            <p id="cpf-error" class="text-sm text-red-600 hidden mt-1" style="font-weight: 600;">CPF inválido. Verifique os números digitados.</p>
          </div>

          <div class="grid grid-2 gap-4">
            <div class="form-group">
              <label class="form-label" for="r-senha">
                Senha <span class="form-required" aria-hidden="true">*</span>
              </label>
              <input class="input" id="r-senha" name="senha" type="password" placeholder="••••••••" required/>
            </div>

            <div class="form-group">
              <label class="form-label" for="r-confirma-senha">
                Confirmar Senha <span class="form-required" aria-hidden="true">*</span>
              </label>
              <input class="input" id="r-confirma-senha" type="password" placeholder="••••••••" required/>
            </div>
          </div>

        </div>

        <div class="golden-divider" role="separator" aria-hidden="true"></div>

        <!-- DADOS PESSOAIS -->
        <h2 class="text-blue-900 mb-4" style="font-size:1.1rem">Dados Pessoais</h2>
        <div class="grid grid-2 gap-4">

          <div class="form-group">
            <label class="form-label" for="r-birth">
              Data de Nascimento <span class="form-required" aria-hidden="true">*</span>
            </label>
            <input class="input" id="r-birth" name="birthDate" type="date" required/>
          </div>

          <div class="form-group">
            <label class="form-label" for="r-phone">
              Telefone <span class="form-required" aria-hidden="true">*</span>
            </label>
            <input class="input" id="r-phone" name="phone" type="tel"
              placeholder="(00) 00000-0000" required/>
          </div>

        </div>

        <div class="form-group mt-4">
          <label class="form-label" for="r-address">
            Endereço Completo <span class="form-required" aria-hidden="true">*</span>
          </label>
          <input class="input" id="r-address" name="address" type="text"
            placeholder="Rua, número, complemento, bairro, cidade — SP" required/>
        </div>

        <div class="golden-divider" role="separator" aria-hidden="true"></div>

        <!-- DADOS DE SAÚDE -->
        <h2 class="text-blue-900 mb-4" style="font-size:1.1rem">Dados de Saúde</h2>
        <div class="form-group">
          <label class="form-label" for="r-health">
            Informações Relevantes
            <span class="text-gray-500 font-semibold" style="font-weight:400"> (opcional)</span>
          </label>
          <textarea class="input" id="r-health" name="healthData" rows="4"
            placeholder="Alergias, condições médicas, medicamentos em uso, etc."></textarea>
          <p class="form-hint">Essas informações ajudam no atendimento personalizado</p>
        </div>

        <!-- AÇÕES -->
        <div class="flex gap-3 mt-6">
          <button type="submit" class="btn btn-primary btn-md flex-1">
            Completar Cadastro
          </button>
          <a href="index.html" class="btn btn-secondary btn-md flex-1" style="text-align:center">
            Cancelar
          </a>
        </div>

        <p class="text-xs text-gray-400 text-center mt-3">
          <span class="form-required">*</span> Campos obrigatórios
        </p>

      </form>
    </div>

  </div>
</main>
<script src="js/config.js"></script>
<script src="js/register.js"></script>
</body>
</html>
